<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正在翻开 · 拾光</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="./assets/css/blog.css">

<body>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand" href="./index.html" aria-label="回到首页">
      <span class="brand-mark">拾光</span>
      <span class="brand-en">daily gleanings</span>

    <nav class="site-nav">
      <a href="./index.html">日常</a>
      <a href="./about.html">关于</a>
      <a href="./write.html" aria-label="写一篇"><span class="label-long">写点东西</span><span class="label-short">写</span></a>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="切换深浅色">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20.2 14.8A8.6 8.6 0 1 1 9.4 4a7 7 0 0 0 10.8 10.8z"/></svg>
      </button>
      <button class="icon-btn" data-lock type="button" aria-label="锁定并退出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="10.6" width="14" height="9.4" rx="2"/><path d="M8.2 10.6V7.8a3.8 3.8 0 0 1 7.6 0v2.8"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="post-page">
  <article class="wrap">
    <header class="post-head">
      <p class="post-kicker" id="postKicker">—</p>
      <h1 class="post-title" id="postTitle">正在翻开这一页…</h1>
      <div class="post-meta" id="postMeta"></div>
    </header>

    <div class="post-cover" id="postCover" hidden>
      <img id="coverImg" alt="">
    </div>

    <div class="prose" id="postBody"></div>

    <div class="post-end" id="postEnd" hidden>
      <span class="post-end-sign" id="postSign"></span>
      <div class="post-actions">
        <a class="ghost-btn" id="editBtn" href="./write.html">改一下</a>
        <a class="ghost-btn" href="./index.html">回到日常</a>
      </div>
    </div>

    <nav class="post-nav" id="postNav" hidden></nav>
  </article>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span class="name">拾光</span>
    <span>内容以密文存放 · 只有拿到密码的人能读</span>
    <div class="footer-links">
      <a href="./index.html">全部日常</a>
      <a href="./write.html">写一篇</a>
    </div>
  </div>
</footer>

<script type="module" src="./assets/js/post.js"></script>
