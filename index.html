<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾光 · 日常记录</title>
<meta name="description" content="一个私人的日常记录本：天气、食物、路上看见的东西，和一些没什么用但很喜欢的瞬间。">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./assets/css/blog.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand" href="./index.html" aria-label="回到首页">
      <span class="brand-mark">拾光</span>
      <span class="brand-en">daily gleanings</span>
    </a>
    <nav class="site-nav">
      <a href="./index.html" class="is-active">日常</a>
      <a href="./about.html">关于</a>
      <a href="./write.html" aria-label="写一篇"><span class="label-long">写点东西</span><span class="label-short">写</span></a>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="切换深浅色">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.4v2M12 19.6v2M2.4 12h2M19.6 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20.2 14.8A8.6 8.6 0 1 1 9.4 4a7 7 0 0 0 10.8 10.8z"/></svg>
      </button>
      <button class="icon-btn" data-lock type="button" aria-label="锁定并退出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="10.6" width="14" height="9.4" rx="2"/><path d="M8.2 10.6V7.8a3.8 3.8 0 0 1 7.6 0v2.8"/></svg>
      </button>
    </nav>
  </div>
</header>

<main>
  <section class="wrap masthead">
    <div>
      <p class="eyebrow" id="heroKicker">daily gleanings · since 2026</p>
      <h1 class="masthead-title">日常</h1>
      <p class="masthead-sub" id="heroSub">把日子过成可以翻的样子。</p>
    </div>
    <dl class="stats" id="heroSide">
      <div><dt>篇数</dt><dd>—</dd></div>
      <div><dt>最近</dt><dd>—</dd></div>
      <div><dt>存放</dt><dd>密文</dd></div>
    </dl>
  </section>

  <div class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div class="search">
        <input id="q" type="search" placeholder="搜索标题、地点、标签" aria-label="搜索文章" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="wrap layout">
    <div class="stream" id="grid" aria-live="polite">
      <div class="row skel">
        <div class="row-thumb"></div>
        <div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-line"></div></div>
      </div>
      <div class="row skel">
        <div class="row-thumb"></div>
        <div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-line"></div></div>
      </div>
      <div class="row skel">
        <div class="row-thumb"></div>
        <div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-line"></div></div>
      </div>
    </div>

    <aside class="rail">
      <section class="rail-block">
        <h2 class="rail-title">标签<span id="tagCount"></span></h2>
        <ul class="tag-list" id="tagList"></ul>
      </section>

      <section class="rail-block">
        <h2 class="rail-title">这一本</h2>
        <ul class="kv" id="railStats">
          <li><span>开始</span><b id="railSince">2026</b></li>
          <li><span>篇数</span><b id="railCount">—</b></li>
          <li><span>最近</span><b id="railLatest">—</b></li>
          <li><span>加密</span><b>AES-256-GCM</b></li>
        </ul>
      </section>

      <section class="rail-block">
        <h2 class="rail-title">关于</h2>
        <p class="rail-text">私人的日常记录。文字与图片都在本机加密后才上传，仓库里只有密文。</p>
        <a class="rail-link" href="./about.html">它是怎么运行的 →</a>
      </section>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span class="name">拾光</span>
    <span id="footNote">内容以密文存放 · 只有拿到密码的人能读</span>
    <div class="footer-links">
      <a href="./about.html">关于</a>
      <a href="./write.html">写一篇</a>
    </div>
  </div>
</footer>

<script type="module" src="./assets/js/home.js"></script>
</body>
</html>
