<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="墨记 —— 优雅、离线可用、可多端同步的加密便签应用。">
<meta name="theme-color" content="#f7f6f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="墨记">
<title>墨记 · InkNote</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  /* 启动锁屏：必须内联，因为应用样式表也是加密资源，解锁后才注入 */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #bootScreen, #bootScreen *, #bootScreen *::before, #bootScreen *::after { box-sizing: border-box; }
  #bootScreen {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    padding: 24px;
    background: #f6f5f1;
    background-image:
      radial-gradient(760px 460px at 12% -10%, #efece4 0%, rgba(239, 236, 228, 0) 62%),
      radial-gradient(620px 400px at 100% 0%, #f2eee6 0%, rgba(242, 238, 230, 0) 58%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #23262b;
    -webkit-font-smoothing: antialiased;
    transition: opacity .32s ease, visibility .32s ease;
  }
  #bootScreen.is-out { opacity: 0; visibility: hidden; }
  .boot-card {
    width: 100%; max-width: 348px;
    padding: 34px 30px 26px;
    border-radius: 20px;
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(0, 0, 0, .07);
    box-shadow: 0 18px 44px -18px rgba(30, 34, 30, .28), 0 2px 6px rgba(0, 0, 0, .04);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
  }
  .boot-mark {
    width: 54px; height: 54px; margin: 0 auto 16px;
    border-radius: 16px;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #35806f, #2a6157);
    color: #fff; font-size: 26px; font-weight: 600;
    letter-spacing: 0;
    box-shadow: 0 8px 18px -8px rgba(42, 97, 87, .6);
  }
  .boot-title { margin: 0 0 5px; font-size: 19px; font-weight: 600; letter-spacing: .3px; }
  .boot-sub { margin: 0 0 22px; font-size: 12.5px; color: #8a8d93; line-height: 1.7; }
  .boot-field { position: relative; margin-bottom: 12px; }
  #bootPwd, .boot-input {
    width: 100%; box-sizing: border-box;
    height: 42px; padding: 0 14px;
    border-radius: 11px;
    border: 1px solid rgba(0, 0, 0, .12);
    background: rgba(255, 255, 255, .9);
    font-size: 13.5px; color: inherit;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #bootPwd:focus, .boot-input:focus {
    border-color: #2f6f62;
    box-shadow: 0 0 0 3px rgba(47, 111, 98, .13);
  }
  #bootPwd::placeholder, .boot-input::placeholder { color: #b3b6bb; }
  .boot-row {
    display: flex; align-items: center; gap: 7px;
    margin: 2px 2px 18px;
    font-size: 12px; color: #8a8d93;
    user-select: none; cursor: pointer;
  }
  .boot-row input { width: 14px; height: 14px; accent-color: #2f6f62; cursor: pointer; margin: 0; }
  #bootGo, #rsGo {
    width: 100%; height: 42px;
    border: 0; border-radius: 11px;
    background: linear-gradient(160deg, #35806f, #2a6157);
    color: #fff; font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    transition: filter .15s, transform .1s;
    box-shadow: 0 8px 20px -10px rgba(42, 97, 87, .7);
  }
  #bootGo:hover, #rsGo:hover { filter: brightness(1.06); }
  #bootGo:active, #rsGo:active { transform: translateY(1px); }
  #bootGo:disabled, #rsGo:disabled { opacity: .65; cursor: default; }
  #bootMsg {
    min-height: 17px; margin: 12px 0 0;
    font-size: 12px; line-height: 1.5; color: #8a8d93;
  }
  #bootMsg[data-tone="err"] { color: #c0563f; }
  #bootRetry {
    margin-top: 12px; padding: 6px 14px;
    border-radius: 99px; border: 1px solid rgba(0, 0, 0, .12);
    background: transparent; color: #6b6f76;
    font-size: 12px; font-family: inherit; cursor: pointer;
  }
  .boot-foot { margin: 18px 0 0; font-size: 11px; color: #a9acb1; letter-spacing: .2px; }
  .boot-link {
    display: inline-block; margin: 14px 0 0; padding: 2px 4px;
    border: 0; background: none;
    font-size: 12px; font-family: inherit; color: #8a8d93; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .boot-link:hover { color: #2f6f62; }
  .boot-link[hidden] { display: none; }
  #bootResetForm { text-align: center; }
  #bootResetForm .boot-field { margin-bottom: 10px; }
  .boot-note { margin: 0 0 14px; font-size: 12px; line-height: 1.65; color: #8a8d93; }
  @media (prefers-color-scheme: dark) {
    #bootScreen {
      background: #101216;
      background-image:
        radial-gradient(760px 460px at 12% -10%, #191d24 0%, rgba(25, 29, 36, 0) 62%),
        radial-gradient(620px 400px at 100% 0%, #171b21 0%, rgba(23, 27, 33, 0) 58%);
      color: #e7e9ec;
    }
    .boot-card {
      background: rgba(27, 31, 38, .78);
      border-color: rgba(255, 255, 255, .07);
      box-shadow: 0 18px 44px -18px rgba(0, 0, 0, .7);
    }
    .boot-sub, .boot-row, #bootMsg { color: #8f939b; }
    #bootPwd {
      background: rgba(15, 18, 22, .8);
      border-color: rgba(255, 255, 255, .1);
    }
    #bootPwd::placeholder { color: #5c6069; }
    #bootRetry { border-color: rgba(255, 255, 255, .12); color: #9a9ea6; }
    .boot-link, .boot-note { color: #8f939b; }
    .boot-link:hover { color: #7fc6b2; }
    .boot-foot { color: #6a6e77; }
  }
</style>
</head>
<body>

<div id="bootScreen">
  <div class="boot-card">
    <div class="boot-mark">墨</div>
    <h1 class="boot-title">墨记 · InkNote</h1>
    <p class="boot-sub">这个站点已加密，需要访问密码才能打开</p>
    <form id="bootForm" autocomplete="off">
      <div class="boot-field">
        <input id="bootPwd" type="password" placeholder="访问密码" autocomplete="current-password" spellcheck="false">
      </div>
      <label class="boot-row"><input type="checkbox" id="bootRemember" checked>在这台设备上记住 30 天</label>
      <button id="bootGo" type="submit">进入墨记</button>
    </form>
    <p id="bootMsg"></p>
    <button id="bootRetry" type="button" hidden onclick="location.reload()">重新加载</button>
    <form id="bootResetForm" autocomplete="off" hidden>
      <p class="boot-note">输入当前密码即可换成新密码</p>
      <div class="boot-field"><input id="rsOld" class="boot-input" type="password" placeholder="当前访问密码" spellcheck="false"></div>
      <div class="boot-field"><input id="rsNew" class="boot-input" type="password" placeholder="新密码（至少 6 位）" spellcheck="false"></div>
      <div class="boot-field"><input id="rsNew2" class="boot-input" type="password" placeholder="再次输入新密码" spellcheck="false"></div>
      <button id="rsGo" type="submit">生成新的加密包</button>
      <button id="rsBack" type="button" class="boot-link">返回</button>
    </form>
    <button id="bootReset" type="button" class="boot-link">重设访问密码</button>
    <p class="boot-foot">内容以密文存放，密码不正确无法解密</p>
  </div>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">需要启用 JavaScript 才能使用墨记。</p></noscript>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">墨</div>
      <div class="brand-text"><strong>墨记</strong><span>InkNote</span></div>
      <button class="icon-btn only-mobile" id="closeSidebar" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    </div>

    <button class="new-note-btn" id="newNoteBtn">
      <svg><use href="#i-plus"/></svg><span>新建便签</span><kbd>N</kbd>
    </button>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="all"><svg><use href="#i-edit"/></svg><span>全部便签</span><em data-count="all"></em></button>
      <button class="nav-item" data-view="favorites"><svg><use href="#i-star"/></svg><span>置顶</span><em data-count="favorites"></em></button>
      <button class="nav-item" data-view="private"><svg><use href="#i-lock"/></svg><span>私密便签</span><em data-count="private"></em></button>
      <button class="nav-item" data-view="archive"><svg><use href="#i-archive"/></svg><span>归档</span><em data-count="archive"></em></button>
      <button class="nav-item" data-view="trash"><svg><use href="#i-trash"/></svg><span>回收站</span><em data-count="trash"></em></button>
    </nav>

    <div class="side-section">
      <div class="side-head"><span>文件夹</span><button class="mini-btn" id="addFolderBtn" title="新建文件夹"><svg><use href="#i-plus"/></svg></button></div>
      <div class="folder-list" id="folderList"></div>
    </div>

    <div class="side-section">
      <div class="side-head"><span>标签</span></div>
      <div class="tag-list" id="tagList"></div>
    </div>

    <div class="sidebar-foot">
      <button class="sync-pill" id="syncBtn"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">本地保存</span><svg><use href="#i-sync"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="设置"><svg><use href="#i-settings"/></svg></button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <section class="list-pane" id="listPane">
    <header class="list-head">
      <button class="icon-btn only-mobile" id="openSidebar" aria-label="菜单"><svg><use href="#i-menu"/></svg></button>
      <div class="search-box" id="searchBox">
        <svg><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="搜索便签、标签…" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" hidden><svg><use href="#i-close"/></svg></button>
      </div>
      <button class="icon-btn" id="sortBtn" title="排序方式"><svg><use href="#i-sort"/></svg></button>
    </header>

    <div class="list-title">
      <h1 id="viewTitle">全部便签</h1>
      <span class="count" id="viewCount"></span>
      <div class="list-actions" id="listActions"></div>
    </div>

    <div class="note-scroll" id="noteScroll">
      <div class="note-list" id="noteList"></div>
      <div class="empty-list" id="emptyList" hidden>
        <div class="empty-icon"><svg><use href="#i-edit"/></svg></div>
        <p id="emptyText">还没有便签，点一下「新建便签」开始记录。</p>
        <button class="ghost-btn" id="emptyNewBtn">写下第一条</button>
      </div>
    </div>

    <div class="list-foot only-mobile">
      <button class="tab active" data-view="all"><svg><use href="#i-edit"/></svg><span>便签</span></button>
      <button class="tab" data-view="favorites"><svg><use href="#i-star"/></svg><span>置顶</span></button>
      <button class="tab tab-new" id="mobileNew"><svg><use href="#i-plus"/></svg></button>
      <button class="tab" data-view="private"><svg><use href="#i-lock"/></svg><span>私密</span></button>
      <button class="tab" id="mobileSettings"><svg><use href="#i-settings"/></svg><span>设置</span></button>
    </div>
  </section>

  <main class="editor-pane" id="editorPane">
    <div class="editor-empty" id="editorEmpty">
      <div class="empty-art">
        <div class="paper p1"></div><div class="paper p2"></div><div class="paper p3">
          <i></i><i></i><i></i>
        </div>
      </div>
      <p>选择左侧便签，或新建一条</p>
      <span class="hint">支持 Markdown、标签、文件夹与私密加密</span>
    </div>

    <div class="editor" id="editor" hidden>
      <header class="editor-head">
        <button class="icon-btn only-mobile" id="editorBack" aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <div class="editor-meta">
          <span id="editorDate"></span>
          <span class="dot-sep"></span>
          <span id="editorWords"></span>
          <span class="lock-badge" id="lockBadge" hidden><svg><use href="#i-lock"/></svg>已加密</span>
        </div>
        <div class="editor-actions">
          <button class="icon-btn" id="pinBtn" title="置顶"><svg><use href="#i-pin"/></svg></button>
          <button class="icon-btn" id="lockBtn" title="设为私密"><svg><use href="#i-shield"/></svg></button>
          <button class="icon-btn" id="moreBtn" title="更多"><svg><use href="#i-more"/></svg></button>
        </div>
      </header>

      <div class="editor-body">
        <div class="toolbar" id="toolbar">
          <button data-cmd="h1" title="标题">H1</button>
          <button data-cmd="h2" title="小标题">H2</button>
          <span class="tb-sep"></span>
          <button data-cmd="bold" title="加粗"><svg><use href="#i-bold"/></svg></button>
          <button data-cmd="italic" title="斜体"><svg><use href="#i-italic"/></svg></button>
          <button data-cmd="strike" title="删除线"><svg><use href="#i-strike"/></svg></button>
          <button data-cmd="code" title="行内代码"><svg><use href="#i-code"/></svg></button>
          <span class="tb-sep"></span>
          <button data-cmd="ul" title="列表"><svg><use href="#i-list"/></svg></button>
          <button data-cmd="todo" title="待办"><svg><use href="#i-check-square"/></svg></button>
          <button data-cmd="quote" title="引用"><svg><use href="#i-quote"/></svg></button>
          <button data-cmd="divider" title="分隔线"><svg><use href="#i-divider"/></svg></button>
          <span class="tb-sep"></span>
          <button data-cmd="link" title="链接"><svg><use href="#i-link"/></svg></button>
          <button data-cmd="image" title="图片"><svg><use href="#i-image"/></svg></button>
          <span class="tb-grow"></span>
          <button data-cmd="preview" id="previewBtn" class="tb-preview" title="预览"><svg><use href="#i-eye"/></svg></button>
        </div>

        <div class="editor-scroll" id="editorScroll">
          <textarea id="editorInput" placeholder="开始书写… 第一行会成为标题" spellcheck="false"></textarea>
          <div class="preview markdown-body" id="preview" hidden></div>
        </div>
        <div class="locked-veil" id="lockedVeil" hidden>
          <div class="lv-inner">
            <svg class="lv-icon"><use href="#i-lock"/></svg>
            <p>这条便签已加密</p>
            <button class="primary-btn" id="unlockBtn">解锁查看</button>
          </div>
        </div>
      </div>

      <footer class="editor-foot">
        <div class="tags-row" id="editorTags"></div>
        <button class="tag-add" id="addTagBtn"><svg><use href="#i-plus"/></svg>标签</button>
        <span class="save-state" id="saveState">已保存</span>
      </footer>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="menu-root" id="menuRoot"></div>

<script src="./assets/js/loader.js" defer></script>
</body>
</html>
