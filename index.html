<!DOCTYPE html>
<html lang="zh-CN" class="is-locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾光日记</title>
<meta name="description" content="一本私人的日记：天气、心情、路上看见的东西，和一些没什么用但很喜欢的瞬间。">
<meta name="theme-color" content="#dbe1e8">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./assets/css/blog.css">
</head>
<body>

<header class="appbar" id="appbar">
  <div class="wrap appbar-inner">
    <a class="brand" href="./index.html" aria-label="回到日记">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 4.4h9.4a2 2 0 0 1 2 2v13.2H7.2a2 2 0 0 1-2-2z"/><path d="M16.6 6.4h2.2v13.2h-2.2"/><path d="M8.2 8.6h5.4M8.2 12h5.4"/></svg>
      </span>
      <span class="brand-text"><b>拾光日记</b><i>diary</i></span>
    </a>
    <nav class="tabs">
      <a class="tab is-active" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.6" width="16" height="14.4" rx="2.4"/><path d="M4 10h16M8.4 3.6v3.6M15.6 3.6v3.6"/><circle cx="12" cy="15" r="1.6"/></svg>
        <span>日记</span>
      </a>
      <a class="tab" href="./about.html"><span>关于</span></a>
      <a class="tab" href="./write.html" aria-label="写日记">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 19.4l1-4.6L15.8 4.6a2 2 0 0 1 2.8 2.8L8.4 17.6z"/><path d="M14 6.4l3.6 3.6"/></svg>
        <span class="label-long">写日记</span><span class="label-short">写</span>
      </a>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="切换深浅色">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.7"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.2 14.8A8.6 8.6 0 1 1 9.4 4a7 7 0 0 0 10.8 10.8z"/></svg>
      </button>
      <button class="icon-btn" data-lock type="button" aria-label="锁定并退出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="10.4" width="14" height="9.6" rx="2.4"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/></svg>
      </button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="book">
      <div class="binding" aria-hidden="true"></div>
      <div class="book-body">

        <header class="book-head">
          <div>
            <p class="eyebrow" id="heroKicker">private diary · since 2026</p>
            <h1 class="book-title">日记</h1>
            <p class="lede" id="heroSub">把日子过成可以翻的样子。</p>
          </div>
          <div class="head-stats" id="heroSide">
            <div class="stat is-accent"><b id="statStreak">—</b><span>连续</span></div>
            <div class="stat"><b id="statMonth">—</b><span>本月</span></div>
            <div class="stat"><b id="statTotal">—</b><span>共</span></div>
          </div>
        </header>

        <div class="toolbar">
          <div class="seg" id="chips"></div>
          <div class="search">
            <input id="q" type="search" placeholder="搜标题、正文、地点" aria-label="搜索日记" autocomplete="off">
          </div>
        </div>

        <div class="layout">
          <div class="stream" id="grid" aria-live="polite">
            <div class="entry skel">
              <div class="entry-day"></div>
              <div class="entry-main">
                <div class="skel-line short"></div>
                <div class="skel-line"></div>
                <div class="skel-line short"></div>
              </div>
            </div>
            <div class="entry skel">
              <div class="entry-day"></div>
              <div class="entry-main">
                <div class="skel-line short"></div>
                <div class="skel-line"></div>
                <div class="skel-line short"></div>
              </div>
            </div>
            <div class="entry skel">
              <div class="entry-day"></div>
              <div class="entry-main">
                <div class="skel-line short"></div>
                <div class="skel-line"></div>
                <div class="skel-line short"></div>
              </div>
            </div>
          </div>

          <aside class="rail">
            <section class="card">
              <div class="cal-head">
                <b id="calTitle">—</b>
                <div class="cal-nav">
                  <button id="calPrev" type="button" aria-label="上个月">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 5.6L8 12l6.4 6.4"/></svg>
                  </button>
                  <button id="calNext" type="button" aria-label="下个月">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 5.6L16 12l-6.4 6.4"/></svg>
                  </button>
                </div>
              </div>
              <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
              <div class="cal-grid" id="calGrid"></div>
            </section>

            <section class="card">
              <h2 class="card-title">这一本</h2>
              <div class="kpi">
                <div class="kpi-row"><span>本月写了</span><b id="kpiMonth">—</b></div>
                <div class="kpi-bar"><i id="kpiBar" style="width:0%"></i></div>
                <div class="kpi-row"><span>总共</span><b id="kpiTotal">—</b></div>
                <div class="kpi-row"><span>标签</span><b id="kpiTags">—</b></div>
                <div class="kpi-row"><span>第一次落笔</span><b id="kpiSince">—</b></div>
                <div class="kpi-row"><span>加密</span><b>AES-256</b></div>
              </div>
            </section>

            <section class="card">
              <h2 class="card-title">标签 <em id="tagCnt2"></em></h2>
              <ul class="tag-list" id="tagList"></ul>
            </section>

            <section class="card">
              <h2 class="card-title">关于</h2>
              <p class="rail-note">私人的日记。文字与照片都在本机加密后才上传，仓库里只有密文。</p>
              <a class="rail-link" href="./about.html">它是怎么运行的
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 5.6L16 12l-6.4 6.4"/></svg>
              </a>
            </section>
          </aside>
        </div>

      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span class="name">拾光日记</span>
    <span id="footNote">内容以密文存放 · 只有拿到密码的人能读</span>
    <div class="footer-links">
      <a href="./about.html">关于</a>
      <a href="./write.html">写一篇</a>
    </div>
  </div>
</footer>

<script type="module" src="./assets/js/home.js"></script>
</body>
</html>
